<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apagones Mérida — Reportes Ciudadanos</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <!-- Leaflet omnivore for KML parsing -->
  <script src="https://api.mapbox.com/mapbox.js/plugins/leaflet-omnivore/v0.3.1/leaflet-omnivore.min.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:        #07090F;
      --bg-panel:  #0E1220;
      --bg-card:   #151B2E;
      --border:    #1E2A3E;
      --muted:     #4A5568;
      --text:      #E2E8F0;
      --text-dim:  #94A3B8;
      --apagon:    #F59E0B;
      --apagon-glow: rgba(245,158,11,0.35);
      --agua:      #0EA5E9;
      --agua-glow: rgba(14,165,233,0.35);
      --success:   #10B981;
      --danger:    #EF4444;
      --radius:    10px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* ── TOPBAR ───────────────────────────────────────────── */
    #topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 58px;
      background: rgba(7,9,15,0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 16px;
      z-index: 1000;
    }

    #topbar .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    #topbar .logo span.bolt {
      color: var(--apagon);
      font-size: 22px;
      animation: blink 1.8s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    #topbar .divider {
      width: 1px;
      height: 28px;
      background: var(--border);
    }

    #topbar .stats {
      display: flex;
      gap: 12px;
      flex: 1;
    }

    .stat-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 13px;
      font-weight: 500;
      transition: border-color 0.2s;
    }

    .stat-pill.apagon { border-color: rgba(245,158,11,0.3); }
    .stat-pill.agua   { border-color: rgba(14,165,233,0.3); }

    .stat-pill .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .stat-pill.apagon .dot { background: var(--apagon); box-shadow: 0 0 6px var(--apagon); }
    .stat-pill.agua   .dot { background: var(--agua);   box-shadow: 0 0 6px var(--agua);   }

    .stat-pill .count {
      font-family: 'Rajdhani', sans-serif;
      font-size: 17px;
      font-weight: 700;
    }
    .stat-pill.apagon .count { color: var(--apagon); }
    .stat-pill.agua   .count { color: var(--agua);   }

    #topbar .actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .layer-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      color: var(--text-dim);
      transition: all 0.2s;
      user-select: none;
    }
    .layer-toggle.active.apagon {
      border-color: var(--apagon);
      color: var(--apagon);
      background: rgba(245,158,11,0.1);
    }
    .layer-toggle.active.agua {
      border-color: var(--agua);
      color: var(--agua);
      background: rgba(14,165,233,0.1);
    }
    .layer-toggle:hover { opacity: 0.85; }

    /* ── MAP ─────────────────────────────────────────────── */
    #map {
      position: fixed;
      top: 58px; bottom: 0; left: 0; right: 0;
      z-index: 1;
    }

    /* Leaflet overrides */
    .leaflet-control-zoom { display: none; }
    .leaflet-attribution-flag { display: none !important; }

    /* ── BOTTOM PANEL ─────────────────────────────────────── */
    #bottom-panel {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 1000;
      pointer-events: none;
    }

    /* ── FAB REPORT BUTTON ───────────────────────────────── */
    #fab {
      position: fixed;
      bottom: 24px;
      right: 20px;
      z-index: 1001;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #F59E0B, #D97706);
      color: #000;
      font-size: 26px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(245,158,11,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    #fab:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 28px rgba(245,158,11,0.7);
    }
    #fab.active {
      background: linear-gradient(135deg, #EF4444, #B91C1C);
      box-shadow: 0 4px 20px rgba(239,68,68,0.5);
    }

    /* ── REPORT MODAL ────────────────────────────────────── */
    #report-modal {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
    }
    #report-modal.open { display: flex; }

    .modal-sheet {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 18px 18px 0 0;
      width: 100%;
      max-width: 520px;
      padding: 24px 24px 40px;
      animation: slideUp 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .modal-handle {
      width: 40px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 20px;
    }

    .modal-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 22px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .modal-sub {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 20px;
    }

    .type-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .type-card {
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .type-card:hover { border-color: var(--muted); }
    .type-card.selected.apagon {
      border-color: var(--apagon);
      background: rgba(245,158,11,0.1);
    }
    .type-card.selected.agua {
      border-color: var(--agua);
      background: rgba(14,165,233,0.1);
    }

    .type-card .icon { font-size: 32px; margin-bottom: 6px; }
    .type-card .label {
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .type-card.apagon .label { color: var(--apagon); }
    .type-card.agua   .label { color: var(--agua);   }

    .modal-location {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      font-size: 13px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .modal-location .pin { font-size: 16px; }

    .modal-btns {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 10px;
    }

    .btn {
      padding: 13px 20px;
      border-radius: var(--radius);
      border: none;
      font-family: 'Rajdhani', sans-serif;
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-ghost {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-dim);
    }
    .btn-ghost:hover { border-color: var(--muted); color: var(--text); }
    .btn-primary {
      background: linear-gradient(135deg, #F59E0B, #D97706);
      color: #000;
      box-shadow: 0 2px 12px rgba(245,158,11,0.35);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(245,158,11,0.5); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-agua {
      background: linear-gradient(135deg, #0EA5E9, #0284C7);
      color: #fff;
      box-shadow: 0 2px 12px rgba(14,165,233,0.35);
    }

    /* ── POPUP / MARKER STYLES ───────────────────────────── */
    .leaflet-popup-content-wrapper {
      background: var(--bg-panel) !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius) !important;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5) !important;
      color: var(--text) !important;
    }
    .leaflet-popup-tip { background: var(--bg-panel) !important; }
    .leaflet-popup-content { font-family: 'Inter', sans-serif !important; }

    .popup-inner { padding: 4px 2px; min-width: 200px; }
    .popup-type {
      font-family: 'Rajdhani', sans-serif;
      font-size: 18px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .popup-type.apagon { color: var(--apagon); }
    .popup-type.agua   { color: var(--agua); }
    .popup-meta { font-size: 12px; color: var(--text-dim); margin-bottom: 12px; }
    .popup-timer { color: var(--text); font-weight: 500; }
    .popup-actions { display: flex; gap: 7px; }
    .popup-btn {
      flex: 1;
      padding: 8px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-dim);
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }
    .popup-btn:hover { border-color: var(--success); color: var(--success); }
    .popup-btn.confirm { border-color: rgba(245,158,11,0.4); color: var(--apagon); }
    .popup-btn.confirm:hover { background: rgba(245,158,11,0.15); }
    .popup-btn.resolve { border-color: rgba(16,185,129,0.4); color: var(--success); }
    .popup-btn.resolve:hover { background: rgba(16,185,129,0.15); }

    /* ── TOAST ───────────────────────────────────────────── */
    #toast-container {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      animation: toastIn 0.25s ease forwards;
    }
    .toast.success { border-color: var(--success); color: var(--success); }
    .toast.info    { border-color: var(--agua);    color: var(--agua);    }
    .toast.warn    { border-color: var(--apagon);  color: var(--apagon);  }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    /* ── LOADING OVERLAY ─────────────────────────────────── */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 5000;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: opacity 0.5s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }

    .loading-logo {
      font-family: 'Rajdhani', sans-serif;
      font-size: 42px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--apagon);
      text-shadow: 0 0 30px var(--apagon-glow);
    }

    .loading-bar {
      width: 200px;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .loading-bar-inner {
      height: 100%;
      background: linear-gradient(90deg, var(--apagon), var(--agua));
      animation: loadingBar 1.5s ease-in-out infinite;
      border-radius: 2px;
    }
    @keyframes loadingBar {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    .loading-sub {
      font-size: 13px;
      color: var(--text-dim);
      letter-spacing: 0.05em;
    }

    /* ── SIDEBAR REPORTS LIST (desktop) ──────────────────── */
    #sidebar {
      position: fixed;
      top: 58px;
      right: 0;
      width: 300px;
      bottom: 0;
      background: rgba(7,9,15,0.92);
      backdrop-filter: blur(14px);
      border-left: 1px solid var(--border);
      z-index: 900;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    #sidebar.open { transform: translateX(0); }

    #sidebar-toggle {
      position: fixed;
      top: 50%;
      right: 0;
      transform: translateY(-50%);
      z-index: 901;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-right: none;
      border-radius: 8px 0 0 8px;
      padding: 12px 8px;
      cursor: pointer;
      color: var(--text-dim);
      font-size: 16px;
      transition: all 0.2s;
    }
    #sidebar-toggle:hover { color: var(--text); background: var(--bg-panel); }
    #sidebar.open ~ #sidebar-toggle { right: 300px; }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      font-family: 'Rajdhani', sans-serif;
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
    }

    #reports-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .report-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .report-item:hover { border-color: var(--muted); }
    .report-item.apagon:hover { border-color: rgba(245,158,11,0.5); }
    .report-item.agua:hover   { border-color: rgba(14,165,233,0.5);  }

    .report-item-head {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 3px;
    }
    .report-item-head.apagon { color: var(--apagon); }
    .report-item-head.agua   { color: var(--agua);   }

    .report-item-meta {
      font-size: 11px;
      color: var(--text-dim);
    }

    .empty-state {
      padding: 40px 16px;
      text-align: center;
      color: var(--text-dim);
      font-size: 13px;
      line-height: 1.6;
    }
    .empty-state .icon { font-size: 36px; margin-bottom: 10px; display: block; }

    /* ── CROSSHAIR MODE ──────────────────────────────────── */
    body.placing-report #map { cursor: crosshair !important; }
    body.placing-report #map * { cursor: crosshair !important; }

    .placing-banner {
      position: fixed;
      top: 74px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      background: rgba(245,158,11,0.95);
      color: #000;
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 8px 20px;
      border-radius: 20px;
      display: none;
      align-items: center;
      gap: 8px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .placing-banner.show { display: flex; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245,158,11,0.4); }
      50%       { box-shadow: 0 0 0 8px rgba(245,158,11,0); }
    }

    /* ── DISTRICT INFO TOOLTIP ───────────────────────────── */
    .district-label {
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      font-weight: 600;
      background: rgba(7,9,15,0.85);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 8px;
      color: var(--text-dim);
      white-space: nowrap;
    }

    /* ── RESPONSIVE ──────────────────────────────────────── */
    @media (max-width: 600px) {
      .stat-pill .label-text { display: none; }
      #sidebar { width: 100vw; }
      #sidebar.open ~ #sidebar-toggle { right: 100vw; }
    }
  </style>
</head>
<body>

<!-- LOADING SCREEN -->
<div id="loading">
  <div class="loading-logo">⚡ APAGONES MX</div>
  <div class="loading-bar"><div class="loading-bar-inner"></div></div>
  <div class="loading-sub">Cargando mapa de Mérida...</div>
</div>

<!-- TOPBAR -->
<div id="topbar">
  <div class="logo">
    <span class="bolt">⚡</span>
    <span>Apagones <span style="color:var(--text-dim);font-weight:400">MX</span></span>
  </div>
  <div class="divider"></div>
  <div class="stats">
    <div class="stat-pill apagon">
      <span class="dot"></span>
      <span class="count" id="count-apagon">0</span>
      <span class="label-text" style="color:var(--text-dim);font-size:12px">Apagones</span>
    </div>
    <div class="stat-pill agua">
      <span class="dot"></span>
      <span class="count" id="count-agua">0</span>
      <span class="label-text" style="color:var(--text-dim);font-size:12px">Fugas</span>
    </div>
  </div>
  <div class="actions">
    <button class="layer-toggle active apagon" id="toggle-apagon" onclick="toggleLayer('apagon')">
      ⚡ Luz
    </button>
    <button class="layer-toggle active agua" id="toggle-agua" onclick="toggleLayer('agua')">
      💧 Agua
    </button>
  </div>
</div>

<!-- MAP -->
<div id="map"></div>

<!-- PLACING BANNER -->
<div class="placing-banner" id="placing-banner">
  📍 Toca el mapa para ubicar el reporte — ESC para cancelar
</div>

<!-- FAB -->
<button id="fab" onclick="openReportFlow()">＋</button>

<!-- TOAST CONTAINER -->
<div id="toast-container"></div>

<!-- SIDEBAR TOGGLE -->
<button id="sidebar-toggle" onclick="toggleSidebar()" title="Ver reportes">◀</button>

<!-- SIDEBAR -->
<div id="sidebar">
  <div class="sidebar-header">📋 Reportes activos</div>
  <div id="reports-list"></div>
</div>

<!-- REPORT MODAL -->
<div id="report-modal" onclick="handleModalBg(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">Nuevo Reporte</div>
    <div class="modal-sub" id="modal-sub">¿Qué está pasando en tu área?</div>

    <div class="type-grid">
      <div class="type-card apagon" id="card-apagon" onclick="selectType('apagon')">
        <div class="icon">⚡</div>
        <div class="label">Apagón</div>
        <div style="font-size:11px;color:var(--text-dim);margin-top:4px">Sin electricidad</div>
      </div>
      <div class="type-card agua" id="card-agua" onclick="selectType('agua')">
        <div class="icon">💧</div>
        <div class="label">Fuga de Agua</div>
        <div style="font-size:11px;color:var(--text-dim);margin-top:4px">Tubería rota / fuga</div>
      </div>
    </div>

    <div class="modal-location" id="modal-location">
      <span class="pin">📍</span>
      <span id="location-text">Toca el mapa para elegir ubicación exacta</span>
    </div>

    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btn-submit" onclick="submitReport()" disabled>
        Reportar
      </button>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════
//  CONFIG
// ════════════════════════════════════════════════════════════
const KML_URL = 'https://api.allorigins.win/raw?url=' +
  encodeURIComponent('https://www.google.com/maps/d/u/0/kml?forcekml=1&mid=10ZjeDwOsMnrbiXpU2NSUh3TJUJbvGdw');

const MERIDA_CENTER = [20.9674, -89.6237];
const REPORT_TTL_MS = 3 * 60 * 60 * 1000; // 3 hours

// ════════════════════════════════════════════════════════════
//  SUPABASE
// ════════════════════════════════════════════════════════════
const SUPABASE_URL = 'https://hnunfwbtwdcwzvwlhxgs.supabase.co';
const SUPABASE_KEY = 'sb_publishable_9DQXs-1NViwO10wZcCfpjw_8rB_noZ4';
const { createClient } = window.supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// ════════════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════════════
let map, kmlLayer;
let pendingLat = null, pendingLng = null;
let pendingType = null;
let isPlacing = false;
let layers = { apagon: true, agua: true };
let markers = {};          // reportId → Leaflet marker
let districtLayers = {};   // seccion → Leaflet polygon layer
let sidebarOpen = false;
let cachedReports = [];    // local cache updated by realtime

// ════════════════════════════════════════════════════════════
//  STORAGE — Supabase
// ════════════════════════════════════════════════════════════
async function loadReports() {
  const cutoff = Date.now() - REPORT_TTL_MS;
  const { data, error } = await db
    .from('reports')
    .select('*')
    .eq('resolved', false)
    .gt('timestamp', cutoff)
    .order('timestamp', { ascending: false });

  if (error) {
    console.error('loadReports error:', error);
    return cachedReports; // fallback to cache on error
  }
  cachedReports = data || [];
  return cachedReports;
}

async function addReport(report) {
  const { data, error } = await db
    .from('reports')
    .insert([{
      id:            report.id,
      type:          report.type,
      lat:           report.lat,
      lng:           report.lng,
      seccion:       report.seccion || '',
      timestamp:     report.timestamp,
      resolved:      false,
      resolved_at:   null,
      confirmations: 0
    }])
    .select()
    .single();

  if (error) {
    console.error('addReport error:', error);
    toast('Error al guardar. Intenta de nuevo.', 'warn');
    return null;
  }
  return data;
}

async function resolveReport(id) {
  const { error } = await db
    .from('reports')
    .update({ resolved: true, resolved_at: Date.now() })
    .eq('id', id);
  if (error) console.error('resolveReport error:', error);
}

async function confirmReport(id) {
  // Increment confirmations safely using RPC or read-modify-write
  const { data: row } = await db
    .from('reports').select('confirmations').eq('id', id).single();
  if (!row) return;
  await db.from('reports')
    .update({ confirmations: (row.confirmations || 0) + 1 })
    .eq('id', id);
}

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

// ════════════════════════════════════════════════════════════
//  REALTIME SUBSCRIPTION
// ════════════════════════════════════════════════════════════
function initRealtime() {
  db.channel('reports-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'reports' },
      (payload) => {
        console.log('Realtime:', payload.eventType);
        renderMarkers(); // refresh on any change
      })
    .subscribe((status) => {
      if (status === 'SUBSCRIBED') {
        console.log('🔴 Realtime conectado');
        toast('🔴 En vivo — actualizaciones en tiempo real', 'info');
      }
    });
}

// ════════════════════════════════════════════════════════════
//  MAP INIT
// ════════════════════════════════════════════════════════════
function initMap() {
  map = L.map('map', {
    center: MERIDA_CENTER,
    zoom: 13,
    zoomControl: false,
    attributionControl: true
  });

  // Dark tile layer
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://carto.com/">CARTO</a> &copy; OSM contributors',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);

  // Click to place report
  map.on('click', (e) => {
    if (isPlacing) {
      pendingLat = e.latlng.lat;
      pendingLng = e.latlng.lng;
      stopPlacing();
      updateLocationText();
      openModal();
    }
  });
}

// ════════════════════════════════════════════════════════════
//  KML LAYER
// ════════════════════════════════════════════════════════════
function loadKMLDistricts() {
  // Style for each district polygon
  const defaultStyle = {
    color: '#1E2A3E',
    weight: 1,
    opacity: 0.7,
    fillColor: '#0E1220',
    fillOpacity: 0.15
  };

  // Try loading via CORS proxy
  fetch(KML_URL)
    .then(r => r.text())
    .then(kmlText => {
      // Parse KML manually
      const parser = new DOMParser();
      const kmlDoc = parser.parseFromString(kmlText, 'text/xml');
      const placemarks = kmlDoc.querySelectorAll('Placemark');

      placemarks.forEach(pm => {
        const name = pm.querySelector('name')?.textContent?.trim() || '';
        const desc = pm.querySelector('description')?.textContent || '';
        const coordsEl = pm.querySelector('coordinates');
        if (!coordsEl) return;

        const dl = (desc.match(/DISTRITO LOCAL\s+(\S+)/) || [])[1] || '';
        const df = (desc.match(/DISTRITO FEDERAL\s+(\S+)/) || [])[1] || '';

        const coordsText = coordsEl.textContent.trim();
        const latlngs = [];
        coordsText.split(/\s+/).forEach(pt => {
          const parts = pt.split(',');
          if (parts.length >= 2) {
            const lng = parseFloat(parts[0]);
            const lat = parseFloat(parts[1]);
            if (!isNaN(lat) && !isNaN(lng)) latlngs.push([lat, lng]);
          }
        });

        if (latlngs.length < 3) return;

        const poly = L.polygon(latlngs, {
          ...defaultStyle,
          seccion: name,
          distrito_local: dl,
          distrito_federal: df
        });

        poly.bindTooltip(`<div class="district-label">Sección ${name} · DL ${dl}</div>`,
          { sticky: true, className: 'leaflet-tooltip-dark', opacity: 1 });

        poly.on('click', (e) => {
          if (isPlacing) {
            pendingLat = e.latlng.lat;
            pendingLng = e.latlng.lng;
            pendingSeccion = name;
            stopPlacing();
            updateLocationText(`Sección ${name} — Distrito Local ${dl}`);
            openModal();
            L.DomEvent.stopPropagation(e);
          }
        });

        districtLayers[name] = poly;
        poly.addTo(map);
      });

      console.log(`Loaded ${Object.keys(districtLayers).length} districts`);
      toast('Distritos cargados ✓', 'success');
    })
    .catch(err => {
      console.warn('KML load failed:', err);
      // Continue without district polygons — still functional
      toast('Mapa base cargado (sin zonas de distrito)', 'info');
    });
}

// Update district polygon style based on reports
function updateDistrictStyles() {
  const reports = loadReports();
  const seccionReports = {};
  reports.forEach(r => {
    if (!r.seccion) return;
    if (!seccionReports[r.seccion]) seccionReports[r.seccion] = [];
    seccionReports[r.seccion].push(r);
  });

  Object.entries(districtLayers).forEach(([seccion, poly]) => {
    const sReports = seccionReports[seccion] || [];
    const hasApagon = sReports.some(r => r.type === 'apagon') && layers.apagon;
    const hasAgua = sReports.some(r => r.type === 'agua') && layers.agua;
    const count = sReports.length;

    if (hasApagon && hasAgua) {
      poly.setStyle({ fillColor: '#C084FC', fillOpacity: 0.35, color: '#A855F7', weight: 1.5 });
    } else if (hasApagon) {
      const intensity = Math.min(0.2 + count * 0.1, 0.55);
      poly.setStyle({ fillColor: '#F59E0B', fillOpacity: intensity, color: '#F59E0B', weight: 1.5 });
    } else if (hasAgua) {
      const intensity = Math.min(0.2 + count * 0.1, 0.55);
      poly.setStyle({ fillColor: '#0EA5E9', fillOpacity: intensity, color: '#0EA5E9', weight: 1.5 });
    } else {
      poly.setStyle({ fillColor: '#0E1220', fillOpacity: 0.15, color: '#1E2A3E', weight: 1 });
    }
  });
}

// ════════════════════════════════════════════════════════════
//  MARKERS
// ════════════════════════════════════════════════════════════
function createMarkerIcon(type, confirmed) {
  const isApagon = type === 'apagon';
  const color = isApagon ? '#F59E0B' : '#0EA5E9';
  const glow = isApagon ? 'rgba(245,158,11,0.5)' : 'rgba(14,165,233,0.5)';
  const icon = isApagon ? '⚡' : '💧';

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="36" height="44" viewBox="0 0 36 44">
    <defs>
      <filter id="glow">
        <feGaussianBlur stdDeviation="2" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <ellipse cx="18" cy="41" rx="8" ry="3" fill="${glow}"/>
    <path d="M18 0 C10 0 4 6 4 14 C4 24 18 40 18 40 C18 40 32 24 32 14 C32 6 26 0 18 0Z"
          fill="${color}" filter="url(#glow)" opacity="0.95"/>
    <text x="18" y="20" text-anchor="middle" font-size="16" dy="0.35em">${icon}</text>
    ${confirmed ? `<circle cx="28" cy="4" r="5" fill="#10B981"/><text x="28" y="4" text-anchor="middle" font-size="8" dy="0.35em" fill="white">✓</text>` : ''}
  </svg>`;

  return L.divIcon({
    html: svg,
    iconSize: [36, 44],
    iconAnchor: [18, 40],
    popupAnchor: [0, -42],
    className: ''
  });
}

function formatTime(ts) {
  const diff = Math.floor((Date.now() - ts) / 60000);
  if (diff < 1) return 'Justo ahora';
  if (diff < 60) return `Hace ${diff} min`;
  return `Hace ${Math.floor(diff/60)}h ${diff%60}m`;
}

function remainingTime(ts) {
  const remaining = REPORT_TTL_MS - (Date.now() - ts);
  const mins = Math.floor(remaining / 60000);
  const hrs = Math.floor(mins / 60);
  const m = mins % 60;
  return hrs > 0 ? `${hrs}h ${m}m restantes` : `${mins}m restantes`;
}

async function renderMarkers() {
  const reports = await loadReports();

  // Remove stale markers
  const currentIds = new Set(reports.map(r => r.id));
  Object.keys(markers).forEach(id => {
    if (!currentIds.has(id)) {
      markers[id].remove();
      delete markers[id];
    }
  });

  // Add / update markers
  reports.forEach(r => {
    if (!r.lat || !r.lng) return;
    if (!layers[r.type]) {
      if (markers[r.id]) { markers[r.id].setOpacity(0.1); }
      return;
    }

    const icon = createMarkerIcon(r.type, r.confirmations > 0);
    if (!markers[r.id]) {
      const m = L.marker([r.lat, r.lng], { icon });
      m.bindPopup(buildPopup(r), { maxWidth: 260, className: 'dark-popup' });
      m.addTo(map);
      markers[r.id] = m;
    } else {
      markers[r.id].setIcon(icon);
      markers[r.id].setOpacity(1);
    }
  });

  updateCounts(reports);
  updateDistrictStyles();
  renderSidebar(reports);
}

function buildPopup(r) {
  const typeLabel = r.type === 'apagon' ? '⚡ Apagón' : '💧 Fuga de Agua';
  const typeClass = r.type;
  const seccionText = r.seccion ? `Sección ${r.seccion} · ` : '';
  return `
    <div class="popup-inner">
      <div class="popup-type ${typeClass}">${typeLabel}</div>
      <div class="popup-meta">
        ${seccionText}${formatTime(r.timestamp)}<br/>
        <span class="popup-timer">${remainingTime(r.timestamp)}</span>
        ${r.confirmations > 0 ? ` · <span style="color:var(--success)">✓ ${r.confirmations} confirmaciones</span>` : ''}
      </div>
      <div class="popup-actions">
        <button class="popup-btn confirm" onclick="handleConfirm('${r.id}')">✓ Confirmar</button>
        <button class="popup-btn resolve" onclick="handleResolve('${r.id}')">✅ Ya se resolvió</button>
      </div>
    </div>`;
}

// ════════════════════════════════════════════════════════════
//  REPORT FLOW
// ════════════════════════════════════════════════════════════
let pendingSeccion = '';

function openReportFlow() {
  pendingLat = null;
  pendingLng = null;
  pendingType = null;
  pendingSeccion = '';

  document.getElementById('card-apagon').classList.remove('selected');
  document.getElementById('card-agua').classList.remove('selected');
  document.getElementById('btn-submit').disabled = true;
  document.getElementById('location-text').textContent = 'Toca el mapa para elegir ubicación exacta';

  // Start placement mode
  startPlacing();
}

function startPlacing() {
  isPlacing = true;
  document.body.classList.add('placing-report');
  document.getElementById('placing-banner').classList.add('show');
  document.getElementById('fab').classList.add('active');
  document.getElementById('fab').textContent = '✕';
  document.getElementById('fab').onclick = cancelPlacing;

  document.addEventListener('keydown', onEscape);
}

function stopPlacing() {
  isPlacing = false;
  document.body.classList.remove('placing-report');
  document.getElementById('placing-banner').classList.remove('show');
  document.getElementById('fab').classList.remove('active');
  document.getElementById('fab').textContent = '＋';
  document.getElementById('fab').onclick = openReportFlow;
  document.removeEventListener('keydown', onEscape);
}

function cancelPlacing() {
  stopPlacing();
  pendingLat = null;
  pendingLng = null;
  closeModal();
}

function onEscape(e) {
  if (e.key === 'Escape') cancelPlacing();
}

function openModal() {
  document.getElementById('report-modal').classList.add('open');
  if (pendingType) updateSubmitBtn();
}

function closeModal() {
  document.getElementById('report-modal').classList.remove('open');
  document.getElementById('fab').classList.remove('active');
  document.getElementById('fab').textContent = '＋';
  document.getElementById('fab').onclick = openReportFlow;
}

function handleModalBg(e) {
  if (e.target === document.getElementById('report-modal')) {
    cancelPlacing();
  }
}

function updateLocationText(label) {
  if (label) {
    document.getElementById('location-text').innerHTML =
      `<strong style="color:var(--text)">${label}</strong>`;
  } else if (pendingLat !== null) {
    document.getElementById('location-text').innerHTML =
      `<strong style="color:var(--text)">${pendingLat.toFixed(5)}, ${pendingLng.toFixed(5)}</strong>`;
  }
}

function selectType(type) {
  pendingType = type;
  document.getElementById('card-apagon').classList.toggle('selected', type === 'apagon');
  document.getElementById('card-agua').classList.toggle('selected', type === 'agua');
  updateSubmitBtn();
}

function updateSubmitBtn() {
  const btn = document.getElementById('btn-submit');
  const ready = pendingType && pendingLat !== null;
  btn.disabled = !ready;

  if (pendingType === 'agua') {
    btn.className = 'btn btn-agua';
    btn.textContent = 'Reportar Fuga';
  } else {
    btn.className = 'btn btn-primary';
    btn.textContent = 'Reportar Apagón';
  }
  if (!ready) btn.disabled = true;
}

async function submitReport() {
  if (!pendingType || pendingLat === null) return;

  const seccion = findSeccionAt(pendingLat, pendingLng);

  const reportData = {
    id: genId(),
    type: pendingType,
    lat: pendingLat,
    lng: pendingLng,
    seccion: seccion,
    timestamp: Date.now(),
    resolved: false,
    resolvedAt: null,
    confirmations: 0
  };

  closeModal();
  toast('Enviando reporte...', 'info');

  const report = await addReport(reportData);
  if (!report) return; // error already shown

  await renderMarkers();
  toast(pendingType === 'apagon' ? '⚡ Apagón reportado' : '💧 Fuga de agua reportada', 'warn');

  map.flyTo([reportData.lat, reportData.lng], 15, { duration: 1 });
  setTimeout(() => {
    if (markers[report.id]) markers[report.id].openPopup();
  }, 1200);

  pendingLat = null;
  pendingLng = null;
  pendingType = null;
}

function findSeccionAt(lat, lng) {
  // Find which district polygon contains this point
  for (const [seccion, poly] of Object.entries(districtLayers)) {
    if (isPointInPolygon(lat, lng, poly.getLatLngs()[0])) {
      return seccion;
    }
  }
  return '';
}

function isPointInPolygon(lat, lng, latlngs) {
  let inside = false;
  const n = latlngs.length;
  let j = n - 1;
  for (let i = 0; i < n; j = i++) {
    const xi = latlngs[i].lat, yi = latlngs[i].lng;
    const xj = latlngs[j].lat, yj = latlngs[j].lng;
    if (((yi > lng) !== (yj > lng)) && (lat < (xj - xi) * (lng - yi) / (yj - yi) + xi)) {
      inside = !inside;
    }
  }
  return inside;
}

// ════════════════════════════════════════════════════════════
//  POPUP ACTIONS
// ════════════════════════════════════════════════════════════
async function handleConfirm(id) {
  await confirmReport(id);
  map.closePopup();
  await renderMarkers();
  toast('✓ Reporte confirmado', 'success');
  setTimeout(() => {
    const m = markers[id];
    if (m) {
      const r = cachedReports.find(x => x.id === id);
      if (r) { m.setPopupContent(buildPopup(r)); m.openPopup(); }
    }
  }, 300);
}

async function handleResolve(id) {
  await resolveReport(id);
  map.closePopup();
  if (markers[id]) { markers[id].remove(); delete markers[id]; }
  await renderMarkers();
  toast('✅ Marcado como resuelto', 'success');
}

// ════════════════════════════════════════════════════════════
//  LAYER TOGGLES
// ════════════════════════════════════════════════════════════
function toggleLayer(type) {
  layers[type] = !layers[type];
  const btn = document.getElementById(`toggle-${type}`);
  btn.classList.toggle('active', layers[type]);
  renderMarkers();
}

// ════════════════════════════════════════════════════════════
//  SIDEBAR
// ════════════════════════════════════════════════════════════
function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  document.getElementById('sidebar').classList.toggle('open', sidebarOpen);
  document.getElementById('sidebar-toggle').textContent = sidebarOpen ? '▶' : '◀';
}

function renderSidebar(reports) {
  const list = document.getElementById('reports-list');
  const active = reports.filter(r => layers[r.type]);

  if (active.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <span class="icon">🌙</span>
        Sin reportes activos en este momento.<br/>
        ¡Todo está bien por ahora!
      </div>`;
    return;
  }

  list.innerHTML = active
    .sort((a, b) => b.timestamp - a.timestamp)
    .map(r => `
      <div class="report-item ${r.type}" onclick="flyToReport('${r.id}')">
        <div class="report-item-head ${r.type}">
          ${r.type === 'apagon' ? '⚡' : '💧'}
          ${r.type === 'apagon' ? 'Apagón' : 'Fuga de Agua'}
          ${r.confirmations > 0 ? `<span style="color:var(--success);font-size:12px">✓${r.confirmations}</span>` : ''}
        </div>
        <div class="report-item-meta">
          ${r.seccion ? `Sección ${r.seccion} · ` : ''}${formatTime(r.timestamp)}<br/>
          ${remainingTime(r.timestamp)}
        </div>
      </div>
    `).join('');
}

async function flyToReport(id) {
  const r = cachedReports.find(x => x.id === id);
  if (r && r.lat) {
    map.flyTo([r.lat, r.lng], 15, { duration: 0.8 });
    setTimeout(() => {
      if (markers[id]) markers[id].openPopup();
    }, 900);
  }
}

// ════════════════════════════════════════════════════════════
//  STATS
// ════════════════════════════════════════════════════════════
function updateCounts(reports) {
  const apCount = reports.filter(r => r.type === 'apagon').length;
  const agCount = reports.filter(r => r.type === 'agua').length;
  document.getElementById('count-apagon').textContent = apCount;
  document.getElementById('count-agua').textContent = agCount;
}

// ════════════════════════════════════════════════════════════
//  TOAST
// ════════════════════════════════════════════════════════════
function toast(msg, type = 'info') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.4s'; }, 2800);
  setTimeout(() => t.remove(), 3200);
}

// ════════════════════════════════════════════════════════════
//  AUTO-REFRESH
// ════════════════════════════════════════════════════════════
setInterval(() => {
  renderMarkers(); // re-render to update timers + expire old reports
}, 60 * 1000); // every minute

// ════════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', async () => {
  initMap();
  loadKMLDistricts();
  initRealtime();

  setTimeout(async () => {
    await renderMarkers();
    const loading = document.getElementById('loading');
    loading.classList.add('hidden');
    setTimeout(() => loading.remove(), 600);
  }, 1200);
});
</script>
